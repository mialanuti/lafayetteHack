name: Update UNC game days

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch official schedules and update CSV
        run: python sync_game_days.py
      - name: Commit changes when dates changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_days.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh UNC game days"
            git push
          fi